name: app-publish-artifact

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  publish-artifact:
    name: Main publish checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: npm ci

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Install docs python dependencies
        run: python3 -m pip install -r scripts/requirements-docs.txt

      - name: Build runtime artifact
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
        run: npm run build

      - name: Run docs regression suite
        env:
          PLAYWRIGHT_ALL_BROWSERS: "1"
        run: npm run test:e2e:docs:regression

      - name: Publish Playwright HTML into docs snapshot
        run: |
          rm -rf docs/test-status/playwright/main-publish-checks
          mkdir -p docs/test-status/playwright/main-publish-checks
          if [ -d playwright-report/docs ]; then
            mkdir -p docs/test-status/playwright/main-publish-checks/docs
            cp -R playwright-report/docs/. docs/test-status/playwright/main-publish-checks/docs/
          fi
          if [ -d playwright-report/app ]; then
            mkdir -p docs/test-status/playwright/main-publish-checks/app
            cp -R playwright-report/app/. docs/test-status/playwright/main-publish-checks/app/
          fi

      - name: Run contract checks
        run: npm run check:contract -- main-publish-checks

      - name: Run artifact checks
        run: npm run check:artifact -- main-publish-checks

      - name: Generate test status snapshot
        run: npm run report:test-status -- main-publish-checks

      - name: Generate and sync docs
        run: |
          python3 scripts/generate_docs_pages.py
          bash scripts/sync_docs.sh

      - name: Upload Playwright reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-reports-main-publish-checks
          path: |
            playwright-report
            artifacts/playwright
          if-no-files-found: warn

      - name: Commit test-status snapshot
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/test-status hosting/public/docs/test-status docs/architecture.html docs/priorities/index.html hosting/public/docs/architecture.html hosting/public/docs/priorities/index.html
          if git diff --cached --quiet; then
            echo "No generated snapshot changes."
            exit 0
          fi
          git commit -m "ci: refresh main publish test status snapshot [skip ci]"
          git pull --rebase
          git push

      # --- Artifact packaging and GCS publish ---

      - name: Package artifacts
        run: bash scripts/package-artifacts.sh

      - name: Determine version
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          SHA=$(git rev-parse HEAD)
          RUN="${{ github.run_number }}"
          echo "semver=${VERSION}+build.${RUN}" >> "$GITHUB_OUTPUT"
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"

      - name: Generate manifest
        run: |
          node scripts/generate-manifest.mjs \
            --bucket "${{ vars.GCS_ARTIFACT_BUCKET }}" \
            --sha    "${{ steps.version.outputs.sha }}" \
            --version "${{ steps.version.outputs.semver }}"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Setup gcloud CLI
        uses: google-github-actions/setup-gcloud@v2

      - name: Upload versioned artifacts to GCS
        run: |
          BUCKET="${{ vars.GCS_ARTIFACT_BUCKET }}"
          SHA="${{ steps.version.outputs.sha }}"
          PREFIX="gs://${BUCKET}/card/versions/${SHA}"

          gsutil -m cp \
            artifacts/publish/runtime.tar.gz \
            artifacts/publish/docs.tar.gz \
            artifacts/publish/checksums.txt \
            artifacts/publish/manifest.json \
            "${PREFIX}/"

          echo "Uploaded artifacts to ${PREFIX}/"

      - name: Verify upload
        run: |
          BUCKET="${{ vars.GCS_ARTIFACT_BUCKET }}"
          SHA="${{ steps.version.outputs.sha }}"
          PREFIX="gs://${BUCKET}/card/versions/${SHA}"

          echo "Listing uploaded objects:"
          gsutil ls "${PREFIX}/"

          echo "Verifying manifest download:"
          gsutil cat "${PREFIX}/manifest.json" | python3 -m json.tool
