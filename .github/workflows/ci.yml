name: app-ci

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    name: CI checks (placeholder)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show event metadata
        run: |
          echo "event=${{ github.event_name }}"
          echo "ref=${{ github.ref }}"

      - name: Verify template contract files exist
        run: |
          test -f README.md
          test -f docs/architecture.md
          test -f docs/artifact-manifest.example.json
          test -f firebase.json

      - name: Placeholder app CI command
        run: |
          echo "Replace with app CI steps (lint/build/docs checks)."
          echo "Example: npm ci && npm run lint && npm run build"
