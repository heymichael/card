name: nightly-checks

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scheduled-regression:
    name: Scheduled regression
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Clone haderach-home for shared-ui
        run: git clone --depth 1 https://x-access-token:${{ secrets.CROSS_REPO_PAT }}@github.com/heymichael/haderach-home.git ../haderach-home

      - name: Install haderach-home dependencies
        run: npm install --prefix ../haderach-home

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run app regression tests
        env:
          PLAYWRIGHT_ALL_BROWSERS: "1"
        run: npm run test:e2e:app -- --grep "@regression"

      - name: Upload Playwright reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-reports-regression
          path: playwright-report
          if-no-files-found: warn

  prod-monitor:
    name: Prod monitor
    runs-on: ubuntu-latest
    needs: scheduled-regression
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Clone haderach-home for shared-ui
        run: git clone --depth 1 https://x-access-token:${{ secrets.CROSS_REPO_PAT }}@github.com/heymichael/haderach-home.git ../haderach-home

      - name: Install haderach-home dependencies
        run: npm install --prefix ../haderach-home

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Check prod monitor base URL
        id: prod_base
        run: |
          if [ -n "${{ vars.CARD_PROD_BASE_URL }}" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run prod monitor tests
        if: steps.prod_base.outputs.enabled == 'true'
        env:
          PLAYWRIGHT_USE_EXTERNAL_BASE_URL: "1"
          E2E_BASE_URL: ${{ vars.CARD_PROD_BASE_URL }}
        run: npm run test:e2e:app -- --grep "@prod-monitor"

      - name: Skip prod monitor tests when URL is missing
        if: steps.prod_base.outputs.enabled != 'true'
        run: echo "CARD_PROD_BASE_URL is not set; skipping prod monitor Playwright suite."

      - name: Upload Playwright reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-reports-prod-monitor
          path: playwright-report
          if-no-files-found: warn
