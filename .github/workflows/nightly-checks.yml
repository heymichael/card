name: nightly-checks

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scheduled-regression:
    name: Scheduled regression (test env)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: npm ci

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Install docs python dependencies
        run: python3 -m pip install -r scripts/requirements-docs.txt

      - name: Run docs and app regression tests
        env:
          PLAYWRIGHT_ALL_BROWSERS: "1"
        run: |
          npm run test:e2e:docs:regression
          npm run test:e2e:app -- --grep "@regression"

      - name: Publish Playwright HTML into docs snapshot
        run: |
          rm -rf docs/test-status/playwright/scheduled-regression
          mkdir -p docs/test-status/playwright/scheduled-regression
          if [ -d playwright-report/docs ]; then
            mkdir -p docs/test-status/playwright/scheduled-regression/docs
            cp -R playwright-report/docs/. docs/test-status/playwright/scheduled-regression/docs/
          fi
          if [ -d playwright-report/app ]; then
            mkdir -p docs/test-status/playwright/scheduled-regression/app
            cp -R playwright-report/app/. docs/test-status/playwright/scheduled-regression/app/
          fi

      - name: Run contract and artifact checks
        run: |
          npm run check:contract -- scheduled-regression
          npm run check:artifact -- scheduled-regression

      - name: Generate test status snapshot
        run: npm run report:test-status -- scheduled-regression

  prod-monitor:
    name: Prod monitor
    runs-on: ubuntu-latest
    needs: scheduled-regression
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: npm ci

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Install docs python dependencies
        run: python3 -m pip install -r scripts/requirements-docs.txt

      - name: Check prod monitor base URL
        id: prod_base
        run: |
          if [ -n "${{ vars.CARD_PROD_DOCS_BASE_URL }}" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run prod monitor tests
        if: steps.prod_base.outputs.enabled == 'true'
        env:
          PLAYWRIGHT_USE_EXTERNAL_BASE_URL: "1"
          E2E_BASE_URL: ${{ vars.CARD_PROD_DOCS_BASE_URL }}
        run: npm run test:e2e:docs:prod-monitor

      - name: Skip prod monitor tests when URL is missing
        if: steps.prod_base.outputs.enabled != 'true'
        run: echo "CARD_PROD_DOCS_BASE_URL is not set; skipping prod monitor Playwright suite."

      - name: Publish Playwright HTML into docs snapshot
        run: |
          rm -rf docs/test-status/playwright/prod-monitor
          mkdir -p docs/test-status/playwright/prod-monitor
          if [ -d playwright-report/docs ]; then
            mkdir -p docs/test-status/playwright/prod-monitor/docs
            cp -R playwright-report/docs/. docs/test-status/playwright/prod-monitor/docs/
          fi

      - name: Run contract and artifact checks
        run: |
          npm run check:contract -- prod-monitor
          npm run check:artifact -- prod-monitor

      - name: Generate test status snapshot
        run: npm run report:test-status -- prod-monitor

      - name: Generate and sync docs
        run: |
          python3 scripts/generate_docs_pages.py
          bash scripts/sync_docs.sh

      - name: Commit nightly snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/test-status hosting/public/docs/test-status docs/architecture.html docs/priorities/index.html hosting/public/docs/architecture.html hosting/public/docs/priorities/index.html
          if git diff --cached --quiet; then
            echo "No nightly snapshot changes."
            exit 0
          fi
          git commit -m "ci: refresh nightly regression and prod monitor snapshots [skip ci]"
          git push
